<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0d" />
    <title>Offline · Mikon</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #0a0b0d; color: #eceef1; font: 15px/1.5 system-ui, sans-serif; padding: 24px; text-align: center;
        background-image: radial-gradient(circle at 1px 1px, rgb(255 255 255 / 0.06) 1px, transparent 0); background-size: 22px 22px; }
      img { width: 64px; height: 64px; border-radius: 18px; }
      h1 { font-size: 22px; margin: 20px 0 6px; }
      p { color: #8a919c; margin: 0 0 20px; max-width: 320px; }
      button { background: #c6f432; color: #0a0b0d; border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 600; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Mikon needs a connection to load your training. Check your signal and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
